name: Docker CD Pipeline

on:
  push:
    branches: [ docker-deploy ]
  workflow_dispatch:
    branches: [ docker-deploy ]

env:
  DOCKER_IMAGE: biblioteca-api
  DOCKER_TAG: latest

jobs:
  test:
    name: Test with Container
    runs-on: ubuntu-latest
    container: maven:3.9.5-eclipse-temurin-17
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      
      - name: Download Maven dependencies with retry
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Downloading Maven dependencies..."
            mvn dependency:go-offline -B && break || sleep 10
          done
      
      - name: Run tests
        run: mvn clean test

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Download Maven dependencies with retry
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Downloading Maven dependencies..."
            mvn dependency:go-offline -B && break || sleep 10
          done
      
      - name: Build JAR
        run: mvn clean package -DskipTests
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=${{ env.DOCKER_TAG }},enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:buildcache,mode=max
      
      - name: Image info
        run: |
          echo "Image pushed: ${{ steps.meta.outputs.tags }}"
          echo "Docker Hub: https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}"

